<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2c1d11;
            color: #f7f3e9;
            display: flex;
            height: 100vh;
            overflow: auto;
        }

        @media (max-width: 820px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .left-panel {
                border-right: none;
                border-bottom: 4px solid #5c3a21;
                padding: 15px;
            }
            .right-panel {
                flex: 1 1 auto;
                width: 100%;
                min-width: 0;
            }
        }

        .left-panel {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3d2616 0%, #20130a 100%);
            border-right: 4px solid #5c3a21;
            position: relative;
            padding: 20px;
        }

        .counter-container {
            text-align: center;
            margin-bottom: 30px;
        }

        #cookie-count {
            font-size: 3rem;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #cps {
            font-size: 1.1rem;
            color: #d1b894;
            margin-top: 5px;
        }

        #total-owned {
            font-size: 0.95rem;
            color: #bfa885;
            margin-top: 3px;
        }

        #combo-display {
            font-size: 0.95rem;
            color: #ff7744;
            margin-top: 5px;
            font-weight: bold;
            height: 20px;
        }

        .cookie-wrapper {
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease;
        }

        .cookie-wrapper:active {
            transform: scale(0.93);
        }

        #big-cookie {
            width: clamp(140px, 22vw, 260px);
            height: clamp(140px, 22vw, 260px);
            background: #8b5a2b;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 -15px 25px rgba(61, 38, 22, 0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chip {
            position: absolute;
            background: #4a2810;
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .c1 { width: 35px; height: 35px; top: 50px; left: 60px; }
        .c2 { width: 25px; height: 25px; top: 120px; right: 40px; }
        .c3 { width: 30px; height: 30px; bottom: 50px; left: 80px; }
        .c4 { width: 20px; height: 20px; top: 80px; right: 100px; }
        .c5 { width: 28px; height: 28px; bottom: 80px; right: 70px; }

        .right-panel {
            flex: 0 1 700px;
            min-width: 320px;
            background: #1f130b;
            display: flex;
            flex-direction: row;
            border-left: 2px solid #4a2e1b;
        }

        .shop-panel, .items-panel {
            flex: 1 1 0;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .shop-panel {
            border-right: 2px solid #4a2e1b;
        }

        .shop-header {
            background: #362113;
            padding: 15px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            border-bottom: 2px solid #4a2e1b;
            color: #ffcc00;
            letter-spacing: 1px;
        }

        .shop-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .shop-item {
            background: #2a1b10;
            border: 2px solid #4a2e1b;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .shop-item:hover:not(.disabled) {
            background: #382416;
            border-color: #8b5a2b;
            transform: translateY(-2px);
        }

        .shop-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #20130a;
        }

        .item-info h4 {
            font-size: 1.1rem;
            color: #ffedb3;
            margin-bottom: 3px;
        }

        .item-info p {
            font-size: 0.85rem;
            color: #bfa885;
        }

        .item-cost {
            font-weight: bold;
            color: #ffcc00;
            font-size: 1rem;
            text-align: right;
            white-space: nowrap;
        }

        .item-owned {
            font-size: 0.8rem;
            color: #8c7655;
            display: block;
            margin-top: 2px;
        }

        .item-expires {
            font-size: 0.8rem;
            color: #ff9955;
            display: block;
            margin-top: 2px;
            font-weight: bold;
        }

        .items-section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #d1b894;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #4a2e1b;
        }

        .item-autobuy-btn {
            background: #5c3a21;
            border: 1px solid #8b5a2b;
            color: #bfa885;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .item-autobuy-btn.active {
            background: #2e5c21;
            color: #77ff77;
            border-color: #77ff77;
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            color: #ffcc00;
            font-size: 1.2rem;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .floating-text.crit {
            color: #ff3333;
            font-size: 1.6rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.3);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f130b;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a2e1b;
            border-radius: 4px;
        }

        .auth-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: calc(100% - 32px);
        }

        .auth-button,
        .logout-button {
            background: #5c3a21;
            border: 1px solid #8b5a2b;
            color: #ffedb3;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .auth-button:hover {
            background: #5c3a21;
            border: 1px solid #8b5a2b;
            color: #ffedb3;
        }

        .logout-button:hover {
            background: #8b5a2b;
            color: #fff8df;
        }

        .user-profile {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(31, 19, 11, 0.88);
            border: 1px solid #4a2e1b;
            border-radius: 8px;
            padding: 5px;
            max-width: 100%;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #5c3a21;
            flex: 0 0 32px;
        }

        .user-email {
            color: #ffedb3;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: min(240px, 30vw);
        }

        @media (max-width: 820px) {
            .auth-bar {
                top: 10px;
                left: 10px;
                max-width: calc(100% - 20px);
            }

            .user-email {
                max-width: 42vw;
            }
        }
    </style>
</head>
<body>

    <div class="left-panel" id="click-area">
        <div class="auth-bar">
            <button class="auth-button" id="login-btn">Sign in with Google</button>
            <div class="user-profile" id="user-profile">
                <img class="user-avatar" id="user-avatar" alt="Profile picture">
                <span class="user-email" id="user-email"></span>
                <button class="logout-button" id="logout-btn">Sign out</button>
            </div>
        </div>
        <div class="counter-container">
            <div id="cookie-count">0.0</div>
            <div id="cps">Cookies per second: 0.0</div>
            <div id="total-owned">Total Cookies Owned: 0</div>
            <div id="combo-display"></div>
        </div>
        <div class="cookie-wrapper" id="cookie-btn">
            <div id="big-cookie">
                <div class="chip c1"></div>
                <div class="chip c2"></div>
                <div class="chip c3"></div>
                <div class="chip c4"></div>
                <div class="chip c5"></div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="shop-panel">
            <div class="shop-header">SHOP</div>
            <div class="shop-list" id="shop-list"></div>
        </div>
        <div class="items-panel">
            <div class="shop-header">ITEMS</div>
            <div class="shop-list" id="items-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            onAuthStateChanged,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // Replace this object with the Firebase config from your Firebase project.
        const firebaseConfig = {
            apiKey: "AIzaSyBhqN5tkt6KQkiEW8-3lRohFebHdj7WMK8",
            authDomain: "cookieclicker-overgames.firebaseapp.com",
            projectId: "cookieclicker-overgames",
            storageBucket: "cookieclicker-overgames.firebasestorage.app",
            messagingSenderId: "67767760822",
            appId: "1:67767760822:web:21678681a771987e043317",
            measurementId: "G-9C19RZETXH"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let loadingSavedGame = true;
        let saveDirty = false;
        let saveInProgress = false;

        const loginBtn = document.getElementById("login-btn");
        const userProfile = document.getElementById("user-profile");
        const userAvatar = document.getElementById("user-avatar");
        const userEmail = document.getElementById("user-email");
        const logoutBtn = document.getElementById("logout-btn");

        function setAuthUI(user) {
            if (user) {
                loginBtn.style.display = "none";
                userProfile.style.display = "flex";
                userAvatar.src = user.photoURL || "";
                userEmail.textContent = user.email || "";
            } else {
                loginBtn.style.display = "block";
                userProfile.style.display = "none";
                userAvatar.removeAttribute("src");
                userEmail.textContent = "";
            }
        }

        function getGameSaveData() {
            return {
                version: 1,
                cookies,
                clickPower,
                clickStreak,
                combo,
                lastClickTime,
                autoBuyTargetId,
                cookieMultiplier,
                potionActiveUntil,
                buildings: buildings.map(building => ({
                    id: building.id,
                    owned: building.owned,
                    cost: building.cost
                })),
                items: items.map(item => ({
                    id: item.id,
                    owned: item.owned
                }))
            };
        }

        function resetGameState() {
            cookies = 0;
            cps = 0;
            clickPower = 1;
            clickStreak = 0;
            combo = 0;
            lastClickTime = 0;
            autoBuyTargetId = null;
            cookieMultiplier = 1;
            potionActiveUntil = 0;

            buildings.forEach(building => {
                building.owned = 0;
                if (building.id === "cookie1") building.cost = 15;
                if (building.id === "cookie2") building.cost = 100;
                if (building.id === "cookie3") building.cost = 500;
                if (building.id === "cookie4") building.cost = 2500;
                if (building.id === "cookie5") building.cost = 15000;
                if (building.id === "luckyCookie") building.cost = 0;
            });

            items.forEach(item => {
                item.owned = 0;
            });

            recalculateCPS();
        }

        function loadGameSave(data) {
            resetGameState();

            if (!data) {
                updateDisplay();
                return;
            }

            cookies = Number(data.cookies) || 0;
            clickPower = Number(data.clickPower) || 1;
            clickStreak = Number(data.clickStreak) || 0;
            combo = Number(data.combo) || 0;
            lastClickTime = Number(data.lastClickTime) || 0;
            autoBuyTargetId = data.autoBuyTargetId || null;
            cookieMultiplier = Number(data.cookieMultiplier) || 1;
            potionActiveUntil = Number(data.potionActiveUntil) || 0;

            if (Array.isArray(data.buildings)) {
                data.buildings.forEach(savedBuilding => {
                    const building = buildings.find(b => b.id === savedBuilding.id);
                    if (!building) return;
                    building.owned = Math.max(0, Number(savedBuilding.owned) || 0);
                    building.cost = Math.max(0, Number(savedBuilding.cost) || building.cost);
                });
            }

            if (Array.isArray(data.items)) {
                data.items.forEach(savedItem => {
                    const item = items.find(i => i.id === savedItem.id);
                    if (!item) return;
                    item.owned = Math.max(0, Number(savedItem.owned) || 0);
                });
            }

            recalculateCPS();
            updateDisplay();
        }

        async function loadGameForUser(user) {
            loadingSavedGame = true;
            saveDirty = false;

            try {
                const saveRef = doc(db, "users", user.uid, "gameData", "save");
                const snapshot = await getDoc(saveRef);

                if (snapshot.exists()) {
                    loadGameSave(snapshot.data());
                } else {
                    resetGameState();
                    updateDisplay();
                }
            } catch (error) {
                console.error("Could not load game:", error);
                resetGameState();
                updateDisplay();
            } finally {
                loadingSavedGame = false;
            }
        }

        async function saveGame() {
            if (!currentUser || loadingSavedGame || !saveDirty || saveInProgress) return;

            saveInProgress = true;
            try {
                const saveRef = doc(db, "users", currentUser.uid, "gameData", "save");
                await setDoc(saveRef, getGameSaveData());
                saveDirty = false;
            } catch (error) {
                console.error("Could not save game:", error);
            } finally {
                saveInProgress = false;
            }
        }

        window.markGameDirty = function() {
            if (currentUser && !loadingSavedGame) {
                saveDirty = true;
            }
        };

        loginBtn.addEventListener("click", async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Google sign-in failed:", error);
                if (error.code !== "auth/popup-closed-by-user") {
                    alert("Sign-in failed. Please try again.");
                }
            }
        });

        logoutBtn.addEventListener("click", async () => {
            try {
                await saveGame();
                await signOut(auth);
            } catch (error) {
                console.error("Sign-out failed:", error);
            }
        });

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            setAuthUI(user);

            if (user) {
                await loadGameForUser(user);
            } else {
                loadingSavedGame = true;
                resetGameState();
                updateDisplay();
                saveDirty = false;
                loadingSavedGame = false;
            }
        });

        setInterval(() => {
            if (currentUser && saveDirty && !loadingSavedGame) {
                saveGame();
            }
        }, 3000);

        window.addEventListener("pagehide", () => {
            if (currentUser && saveDirty && !loadingSavedGame) {
                saveGame();
            }
        });
    </script>

    <script>
        let cookies = 0;
        let cps = 0;
        let clickPower = 1;

        // Combo system (max 40)
        let clickStreak = 0;
        let combo = 0;
        let lastClickTime = 0;
        const comboTimeWindow = 400; // ms

        // Auto-buy target system
        let autoBuyTargetId = null;

        const buildings = [
            {
                id: 'cookie1',
                name: 'Cookie',
                description: 'Generates +0.1 cookies per second.',
                cost: 15,
                cps: 0.1,
                owned: 0,
                multiplier: 1.15
            },
            {
                id: 'cookie2',
                name: 'Cookie Pack',
                description: 'Generates +1 cookie per second.',
                cost: 100,
                cps: 1,

            },
            {
                id: 'cookie3',
                name: 'Cookie Box',
                description: 'Generates +5 cookies per second.',
                cost: 500,
                cps: 5,
                owned: 0,
                multiplier: 1.15
            },
            {
                id: 'cookie4',

                description: 'Generates +10 cookies per second.',
                cost: 2500,
                cps: 10,
                owned: 0,
                multiplier: 1.15
            },
            {
                id: 'cookie5',
                name: 'Cookie Chest',

                cost: 15000,
                cps: 50,

            },
            {

                cost: 0,
                cps: 100,
                owned: 0,
                multiplier: 1,
                unbuyable: true
            }
        ];

        const itemSections = [
            {
                title: 'Potions:',
                items: [
                    {
                        id: 'cookiePotion',
                        name: 'Cookie Potion',
                        description: 'Doubles every cookie you earn. Can be obtained from Lucky Blocks.',
                        owned: 0
                    }
                ]
            },
            {
                title: 'Lucky Blocks:',
                items: [
                    {
                        id: 'basicLuckyBlock',
                        name: 'Basic Lucky Block',
                        description: '70% Nothing, 15% 1-10K Cookies, 9.9% Cookie Chest, 5% Cookie Potion, 0.1% Lucky Cookie. Can be obtained by clicking.',
                        owned: 0
                    },
                    {
                        id: 'epicLuckyBlock',
                        name: 'Epic Lucky Block',
                        description: '40% Nothing, 25% 1-10K Cookies, 20% Cookie Chest, 14.5% Cookie Potion, 0.5% Lucky Cookie. Can be obtained by clicking.',
                        owned: 0
                    },
                    {
                        id: 'legendaryLuckyBlock',
                        name: 'Legendary Lucky Block',
                        description: '15% Nothing, 30% 1-10K Cookies, 25% Cookie Chest, 29% Cookie Potion, 1% Lucky Cookie. Can be obtained by clicking.',
                        owned: 0
                    }
                ]
            }
        ];

        // Flat list of all items, for easy lookup
        const items = itemSections.flatMap(section => section.items);

        let cookieMultiplier = 1;
        let potionActiveUntil = 0; // timestamp (ms) when the Cookie Potion effect ends
        const POTION_DURATION_MS = 5 * 60 * 1000; // 5 minutes
        const LUCKY_BLOCK_DROP_CHANCE = 0.0005; // 0.05%
        const EPIC_LUCKY_BLOCK_DROP_CHANCE = 0.0001; // 0.01%
        const LEGENDARY_LUCKY_BLOCK_DROP_CHANCE = 0.00002; // 0.002%

        const cookieCountEl = document.getElementById('cookie-count');
        const cpsEl = document.getElementById('cps');
        const totalOwnedEl = document.getElementById('total-owned');
        const comboDisplayEl = document.getElementById('combo-display');
        const cookieBtn = document.getElementById('cookie-btn');
        const clickArea = document.getElementById('click-area');
        const shopListEl = document.getElementById('shop-list');
        const itemsListEl = document.getElementById('items-list');

        // Usuwa zbędne zera po przecinku: "1.50" -> "1.5", "2.00" -> "2", "10.0" -> "10"
        function trimTrailingZero(str) {
            return str.includes('.') ? str.replace(/\.?0+$/, '') : str;
        }

        // 1 000 = k, 1 000k = m, 1 000m = b, 1 000b = t, itd.
        const NUMBER_SUFFIXES = ['', 'k', 'm', 'b', 't', 'qa', 'qi', 'sx', 'sp', 'oc', 'no', 'dc'];

        function formatNumber(num) {
            if (num < 1000) return trimTrailingZero(num.toFixed(1));

            let tier = 0;
            let scaled = num;
            while (scaled >= 1000 && tier < NUMBER_SUFFIXES.length - 1) {
                scaled /= 1000;
                tier++;
            }

            // Za dużo nawet na ostatni przyrostek -> zapis naukowy
            if (scaled >= 1000) return num.toExponential(2).replace('+', '');

            // Zaokrąglenie może dać 1000.00 (np. 999.999k) -> przeskocz na wyższy przyrostek
            let text = scaled.toFixed(2);
            if (parseFloat(text) >= 1000 && tier < NUMBER_SUFFIXES.length - 1) {
                scaled /= 1000;
                tier++;
                text = scaled.toFixed(2);
            }

            return trimTrailingZero(text) + NUMBER_SUFFIXES[tier];
        }

        function initShop() {
            shopListEl.innerHTML = '';
            buildings.forEach(building => {
                const itemEl = document.createElement('div');
                itemEl.id = `shop-item-${building.id}`;

                if (building.unbuyable) {
                    itemEl.className = 'shop-item';
                    itemEl.innerHTML = `
                        <div class="item-info">
                            <h4>${building.name}</h4>
                            <p>${building.description}</p>
                            <span class="item-owned" id="owned-${building.id}">Owned: 0</span>
                        </div>
                    `;
                } else {
                    itemEl.className = 'shop-item disabled';
                    itemEl.onclick = () => buyBuilding(building.id);

                    itemEl.innerHTML = `
                        <div class="item-info">
                            <h4>${building.name}</h4>
                            <p>${building.description}</p>
                            <span class="item-owned" id="owned-${building.id}">Owned: 0</span>
                        </div>
                        <div style="display: flex; flex-direction: column; align-items: flex-end; margin-left: 10px;">
                            <div class="item-cost" id="cost-${building.id}" style="margin-bottom: 5px;">
                                ${formatNumber(building.cost)} 🍪
                            </div>
                            <button class="item-autobuy-btn" id="autobuy-btn-${building.id}" onclick="event.stopPropagation(); toggleAutoBuyTarget('${building.id}')">Auto: OFF</button>
                        </div>
                    `;
                }
                shopListEl.appendChild(itemEl);
            });
        }

        function updateShopUI() {
            buildings.forEach(building => {
                const itemEl = document.getElementById(`shop-item-${building.id}`);
                const ownedEl = document.getElementById(`owned-${building.id}`);

                if (building.unbuyable) {
                    if (itemEl && ownedEl) {
                        ownedEl.innerText = `Owned: ${building.owned}`;
                    }
                    return;
                }

                const costEl = document.getElementById(`cost-${building.id}`);
                const autoBtn = document.getElementById(`autobuy-btn-${building.id}`);

                if (itemEl && ownedEl && costEl && autoBtn) {
                    if (cookies >= building.cost) {
                        itemEl.classList.remove('disabled');
                    } else {
                        itemEl.classList.add('disabled');
                    }
                    ownedEl.innerText = `Owned: ${building.owned}`;
                    costEl.innerText = `${formatNumber(building.cost)} 🍪`;

                    if (autoBuyTargetId === building.id) {
                        autoBtn.innerText = 'Auto: ON';
                        autoBtn.classList.add('active');
                    } else {
                        autoBtn.innerText = 'Auto: OFF';
                        autoBtn.classList.remove('active');
                    }
                }
            });
        }

        function initItems() {
            itemsListEl.innerHTML = '';
            itemSections.forEach(section => {
                const titleEl = document.createElement('div');
                titleEl.className = 'items-section-title';
                titleEl.innerText = section.title;
                itemsListEl.appendChild(titleEl);

                section.items.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'shop-item disabled';
                    itemEl.id = `item-${item.id}`;
                    itemEl.onclick = () => useItem(item.id);

                    itemEl.innerHTML = `
                        <div class="item-info">
                            <h4>${item.name}</h4>
                            <p>${item.description}</p>
                            <span class="item-owned" id="item-owned-${item.id}">Owned: 0</span>
                            <span class="item-expires" id="item-expires-${item.id}"></span>
                        </div>
                    `;
                    itemsListEl.appendChild(itemEl);
                });
            });
        }

        function formatDuration(ms) {
            const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            if (hours > 0) {
                let result = `${hours}h`;
                if (minutes > 0) result += ` ${minutes}m`;
                if (seconds > 0) result += ` ${seconds}s`;
                return result;
            }
            if (minutes > 0) {
                return seconds > 0 ? `${minutes}m ${seconds}s` : `${minutes}m`;
            }
            return `${seconds}s`;
        }

        function updateItemsUI() {
            items.forEach(item => {
                const itemEl = document.getElementById(`item-${item.id}`);
                const ownedEl = document.getElementById(`item-owned-${item.id}`);
                const expiresEl = document.getElementById(`item-expires-${item.id}`);

                if (itemEl && ownedEl && expiresEl) {
                    if (item.owned > 0) {
                        itemEl.classList.remove('disabled');
                    } else {
                        itemEl.classList.add('disabled');
                    }
                    ownedEl.innerText = `Owned: ${item.owned}`;

                    if (item.id === 'cookiePotion') {
                        const remaining = potionActiveUntil - Date.now();
                        if (remaining > 0) {
                            expiresEl.innerText = `Expires In: ${formatDuration(remaining)}`;
                        } else {
                            expiresEl.innerText = '';
                        }
                    }
                }
            });
        }

        function useItem(id) {
            const item = items.find(i => i.id === id);
            if (!item || item.owned <= 0) return;

            if (item.id === 'cookiePotion') {
                item.owned--;
                markGameDirty();
                // Stackuje się: dodaje 5 minut do aktualnie pozostałego czasu
                // (a jeśli potka wygasła, liczy od teraz)
                potionActiveUntil = Math.max(potionActiveUntil, Date.now()) + POTION_DURATION_MS;
                updateDisplay();
            }

            if (item.id === 'basicLuckyBlock') {
                item.owned--;
                markGameDirty();
                openBasicLuckyBlock();
                updateDisplay();
            }

            if (item.id === 'epicLuckyBlock') {
                item.owned--;
                markGameDirty();
                openEpicLuckyBlock();
                updateDisplay();
            }

            if (item.id === 'legendaryLuckyBlock') {
                item.owned--;
                markGameDirty();
                openLegendaryLuckyBlock();
                updateDisplay();
            }
        }

        function rollCookieAmount() {
            return Math.floor(Math.random() * (10000 - 1 + 1)) + 1;
        }

        function grantCookieChest() {
            const chest = buildings.find(b => b.id === 'cookie5');
            if (chest) {
                chest.owned++;
                markGameDirty();
                recalculateCPS();
            }
        }

        // Otwiera Basic Lucky Block i losuje nagrodę
        function openBasicLuckyBlock() {
            const roll = Math.random() * 100;
            let resultText = '';

            if (roll < 70) {
                // 70% Nothing
                resultText = 'Nothing';
            } else if (roll < 85) {
                // 15% 1-10K Cookies
                const amount = rollCookieAmount();
                cookies += amount;
                markGameDirty();
                resultText = `${formatNumber(amount)} Cookies`;
            } else if (roll < 94.9) {
                // 9.9% Cookie Chest
                grantCookieChest();
                resultText = 'Cookie Chest';
            } else if (roll < 99.9) {
                // 5% Cookie Potion
                grantCookiePotion();
                resultText = 'Cookie Potion';
            } else {
                // 0.1% Lucky Cookie
                grantLuckyCookie();
                resultText = 'Lucky Cookie';
            }

            showLuckyBlockResult(resultText);
        }

        // Otwiera Epic Lucky Block i losuje nagrodę
        function openEpicLuckyBlock() {
            const roll = Math.random() * 100;
            let resultText = '';

            if (roll < 40) {
                // 40% Nothing
                resultText = 'Nothing';
            } else if (roll < 65) {
                // 25% 1-10K Cookies
                const amount = rollCookieAmount();
                cookies += amount;
                resultText = `${formatNumber(amount)} Cookies`;
            } else if (roll < 85) {
                // 20% Cookie Chest
                grantCookieChest();
                resultText = 'Cookie Chest';
            } else if (roll < 99.5) {
                // 14.5% Cookie Potion
                grantCookiePotion();
                resultText = 'Cookie Potion';
            } else {
                // 0.5% Lucky Cookie
                grantLuckyCookie();
                resultText = 'Lucky Cookie';
            }

            showLuckyBlockResult(resultText);
        }

        function showLuckyBlockResult(resultText) {
            alert(`You got: ${resultText}`);
        }

        // Otwiera Legendary Lucky Block i losuje nagrodę
        function openLegendaryLuckyBlock() {
            const roll = Math.random() * 100;
            let resultText = '';

            if (roll < 15) {
                // 15% Nothing
                resultText = 'Nothing';
            } else if (roll < 45) {
                // 30% 1-10K Cookies
                const amount = rollCookieAmount();
                cookies += amount;
                resultText = `${formatNumber(amount)} Cookies`;
            } else if (roll < 70) {
                // 25% Cookie Chest
                grantCookieChest();
                resultText = 'Cookie Chest';
            } else if (roll < 99) {
                // 29% Cookie Potion
                grantCookiePotion();
                resultText = 'Cookie Potion';
            } else {
                // 1% Lucky Cookie
                grantLuckyCookie();
                resultText = 'Lucky Cookie';
            }

            showLuckyBlockResult(resultText);
        }

        function updatePotionEffect() {
            cookieMultiplier = (potionActiveUntil > Date.now()) ? 2 : 1;
        }

        function grantCookiePotion() {
            const potion = items.find(i => i.id === 'cookiePotion');
            if (potion) {
                potion.owned++;
                markGameDirty();
            }
        }

        function grantLuckyCookie() {
            const luckyCookie = buildings.find(b => b.id === 'luckyCookie');
            if (luckyCookie) {
                luckyCookie.owned++;
                markGameDirty();
                recalculateCPS();
            }
        }

        function grantBasicLuckyBlock() {
            const luckyBlock = items.find(i => i.id === 'basicLuckyBlock');
            if (luckyBlock) {
                luckyBlock.owned++;
                markGameDirty();
            }
        }

        function grantEpicLuckyBlock() {
            const luckyBlock = items.find(i => i.id === 'epicLuckyBlock');
            if (luckyBlock) {
                luckyBlock.owned++;
                markGameDirty();
            }
        }

        function grantLegendaryLuckyBlock() {
            const luckyBlock = items.find(i => i.id === 'legendaryLuckyBlock');
            if (luckyBlock) {
                luckyBlock.owned++;
                markGameDirty();
            }
        }

        // Szansa na Basic, Epic i Legendary Lucky Block z klikania - zawsze aktywna, niezależnie od budynków
        function tryDropLuckyBlockFromClick() {
            if (Math.random() < LUCKY_BLOCK_DROP_CHANCE) {
                grantBasicLuckyBlock();
            }
            if (Math.random() < EPIC_LUCKY_BLOCK_DROP_CHANCE) {
                grantEpicLuckyBlock();
            }
            if (Math.random() < LEGENDARY_LUCKY_BLOCK_DROP_CHANCE) {
                grantLegendaryLuckyBlock();
            }
        }

        function toggleAutoBuyTarget(id) {
            if (autoBuyTargetId === id) {
                autoBuyTargetId = null;
            } else {
                autoBuyTargetId = id;
            }
            markGameDirty();
            updateShopUI();
        }

        function processAutoBuy() {
            if (!autoBuyTargetId) return;
            const building = buildings.find(b => b.id === autoBuyTargetId);
            if (building && cookies >= building.cost) {
                buyBuilding(building.id);
            }
        }

        cookieBtn.addEventListener('click', (e) => {
            const now = Date.now();
            
            if (now - lastClickTime <= comboTimeWindow) {
                clickStreak++;
            } else {
                clickStreak = 1;
            }
            lastClickTime = now;

            // Combo starts at 10 clicks (max 40)
            if (clickStreak >= 10) {
                combo = Math.min(40, clickStreak);
            } else {
                combo = 0;
            }

            // Mnożnik kliknięć według nowych progów:
            // 10 = x2, 20 = x3, 30 = x4, 40 = x5
            let comboMultiplier = 1;
            if (combo >= 40) comboMultiplier = 5;
            else if (combo >= 30) comboMultiplier = 4;
            else if (combo >= 20) comboMultiplier = 3;
            else if (combo >= 10) comboMultiplier = 2;

            let totalEarn = clickPower * comboMultiplier;

            // 0.5% szans na Critical Click
            let isCrit = Math.random() < 0.005;
            if (isCrit) {
                totalEarn *= 3;
            }

            updatePotionEffect();
            totalEarn *= cookieMultiplier;

            cookies += totalEarn;
            markGameDirty();
            tryDropLuckyBlockFromClick();
            updateDisplay();

            createFloatingText(e.clientX, e.clientY, isCrit ? `CRIT! +${totalEarn}` : `+${totalEarn}`, isCrit);
        });

        function createFloatingText(x, y, text, isCrit) {
            const el = document.createElement('div');
            el.className = isCrit ? 'floating-text crit' : 'floating-text';
            el.innerText = text;
            el.style.left = `${x - 20}px`;
            el.style.top = `${y - 30}px`;
            clickArea.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 600);
        }

        function buyBuilding(id) {
            const building = buildings.find(b => b.id === id);
            if (building.unbuyable) return;
            if (cookies >= building.cost) {
                cookies -= building.cost;
                building.owned++;
                building.cost = Math.ceil(building.cost * building.multiplier);
                markGameDirty();
                
                recalculateCPS();
                updateDisplay();
            }
        }

        function recalculateCPS() {
            cps = buildings.reduce((acc, b) => acc + (b.owned * b.cps), 0);
        }

        function updateDisplay() {
            updatePotionEffect();
            cookieCountEl.innerText = formatNumber(cookies);
            cpsEl.innerText = `Cookies per second: ${trimTrailingZero((cps * cookieMultiplier).toFixed(1))}`;
            
            const totalOwned = buildings.reduce((acc, b) => acc + b.owned, 0);
            totalOwnedEl.innerText = `Total Cookies Owned: ${totalOwned}`;

            if (combo >= 10) {
                let comboText = `Combo x${combo}`;
                if (combo >= 40) {
                    comboText += ` (MAX)`;
                }
                comboDisplayEl.innerText = comboText;
            } else {
                comboDisplayEl.innerText = '';
            }

            updateShopUI();
            updateItemsUI();
        }

        // Reset combo, jeśli gracz przestanie szybko klikać
        setInterval(() => {
            if (Date.now() - lastClickTime > comboTimeWindow) {
                if (clickStreak > 0 || combo > 0) {
                    clickStreak = 0;
                    combo = 0;
                    updateDisplay();
                }
            }
        }, 100);

        setInterval(() => {
            updatePotionEffect();
            if (cps > 0) {
                cookies += cps * cookieMultiplier;
                markGameDirty();
            }
            processAutoBuy();
            updateDisplay();
        }, 1000);

        initShop();
        initItems();
        updateDisplay();
    </script>
</body>
</html>
